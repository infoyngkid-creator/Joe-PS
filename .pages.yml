# Konfiguration für Pages CMS (https://pagescms.org)
# Login über GitHub. Bearbeitet nur die hier freigegebenen Dateien.

content:
  - name: termine
    label: Termine
    type: file
    path: content/termine.json
    format: json
    fields:
      - name: termine
        label: Termine
        type: object
        list: true
        fields:
          - name: datum
            label: Datum
            type: date
            required: true
          - name: club
            label: Club
            type: string
            required: true
          - name: stadt
            label: Stadt
            type: string
          - name: link
            label: Link (muss mit https:// anfangen, optional)
            type: string

  - name: follower
    label: Follower
    type: file
    path: content/stats.json
    format: json
    fields:
      - name: aktualisiert
        label: Stand (Datum)
        type: date
      - name: instagram
        label: Instagram-Follower
        type: object
        fields:
          - name: joelaredeo_
            label: JOELAREDO (@joelaredeo_)
            type: number
          - name: psgotrich_
            label: PSGOTRICH (@psgotrich_)
            type: number

  - name: musik
    label: Musik (Joe Laredo)
    type: file
    path: content/musik.json
    format: json
    fields:
      - name: status
        label: Status-Text (z. B. „In Arbeit.“ oder „Neue Single draußen.“)
        type: string
      - name: links
        label: Streaming-Links
        type: object
        list: true
        fields:
          - name: plattform
            label: Plattform (z. B. Spotify, Apple Music, SoundCloud, YouTube)
            type: string
            required: true
          - name: url
            label: Link (muss mit https:// anfangen)
            type: string
            required: true
