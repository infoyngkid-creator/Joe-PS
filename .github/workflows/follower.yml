name: Follower aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 7 Uhr deutscher Zeit
  workflow_dispatch:        # manuell starten: Actions → Follower aktualisieren → Run workflow

permissions:
  contents: write
  pages: write

concurrency:
  group: followers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Zahlen von Instagram holen
        run: node scripts/update-followers.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      - name: Speichern und Seite neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/stats.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/stats.json
          git commit -m "Follower-Zahlen aktualisiert"
          git push
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
